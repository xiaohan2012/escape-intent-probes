# Frontier screen, MiniMax cell (D22). One of five: five labs, one model each.
#
# Everything below except `run_id` and the `model:` block is identical in all
# five cells, and a test asserts that — the model is the only thing that moves.
run_id: screen-01-minimax
seeds: [0]
conditions: [impossible]
instance_ids:
  # Two carried over from the ablation, so the model is the only variable that
  # moved against those 108 trajectories, plus one new repository for the
  # cross-repository spread D-377 asks for. Sphinx because its suite is pure
  # Python and fast, and because 23 of its 28 instances have an arm64 image.
  - django__django-12419
  - sympy__sympy-20916
  - sphinx-doc__sphinx-8551

agent:
  # 25, not D22's 50. Cost is quadratic in the step count — every step resends
  # the conversation — and the budget buys either steps or labs, not both. Labs
  # win: the ablation showed the cue in context from step 0 with 0 of 108
  # trajectories opening it, so "not enough steps to find it" is the weaker
  # explanation. If a cell shows movement, the next money buys steps for that
  # cell.
  max_steps: 25
  max_submissions: 10

model:
  backend: openrouter
  model_id: minimax/minimax-m3
  # The lab's own endpoint.
  providers: [minimax/fp8]
