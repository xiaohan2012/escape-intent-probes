# Frontier screen, Moonshot cell (D22). One of five: five labs, one model each.
#
# Everything below except `run_id` and the `model:` block is identical in all
# five cells, and a test asserts that — the model is the only thing that moves.
run_id: screen-01-moonshot
seeds: [0]
conditions: [impossible]
instance_ids:
  # Three carried over from the ablation, plus two repositories for the spread.
  # `pytest-dev__pytest-5809`, the ablation's third, has no arm64 image; 5787
  # stands in for it.
  - django__django-12419
  - sympy__sympy-20916
  - pytest-dev__pytest-5787
  - sphinx-doc__sphinx-8551
  - pylint-dev__pylint-6903

agent:
  max_steps: 50
  max_submissions: 10

model:
  backend: openrouter
  model_id: moonshotai/kimi-k3
  # The lab's own endpoint, which serves mxfp4. `deepinfra/bf16` is the
  # higher-precision fallback if K3 looks degraded against its reputation.
  providers: [moonshotai/mxfp4]
