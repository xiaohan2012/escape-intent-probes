[project]
name = "escape-intent-probes"
version = "0.1.0"
description = "Do activation probes flag sandbox-escape intent before the action executes?"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Han Xiao", email = "xiaohan2012@gmail.com" }]
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "docker>=7",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escape_probes"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pre-commit>=3.7",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]
# The model itself. Kept out of core so the loop can be developed and tested
# against the fake model with no torch install, and so CI stays fast.
# `uv sync --group model` on the GPU box.
model = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate",
]
# The fast inference path, in its own group because vllm pins its own torch and
# resolving it together with the `model` group tends to fail. Install it into a
# separate venv if the resolver objects: `uv sync --group vllm` alone.
vllm = [
    "vllm>=0.8",
]
# The hosted-endpoint path, for the frontier screen (D22). Its own group
# because the screen needs no weights at all — no torch, no vllm, no GPU.
api = [
    "httpx",
]
# SWE-bench instances: the dataset, plus upstream's per-repo test commands and
# log parsers. Imported lazily so the loop and its tests run without them.
tasks = [
    "datasets",
    # Pinned to the 2.x/3.x line, which is what the dataset's schema belongs to
    # and what ImpossibleBench was built against. swebench 5's `make_test_spec`
    # expects a newer instance schema (an `image` field the dataset does not
    # carry), and it moved the per-repo test commands out of
    # `MAP_REPO_VERSION_TO_SPECS` entirely.
    "swebench>=2.1,<4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]
# The docs quote source verbatim — mutated test bodies, container output — and
# reformatting a quotation makes it a paraphrase.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# `datasets` and `swebench` live in the optional `tasks` group and are imported
# lazily, so they are absent from a core install and from CI by design.
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not docker'"
markers = [
    "docker: needs a running Docker daemon",
    "gpu: needs a GPU and the `model` dependency group",
]
